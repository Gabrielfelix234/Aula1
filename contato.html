<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz para progamadores</title>
    <link rel="shortcut icon" href="img/favicon.ic" type="image/x-icon">
    <link rel="stylesheet" href="./style/stylecontato.css">
</head>
<body>
     <header class="cabecalho">
        <h1>
            Quiz interativo para progamadores
        </h1>
        <p>
            Teste seus conhecimentos em programação e veja em qual pontuação você consegue fazer!
        </p>
        <div class="cabecalho-menu">
            <a href="index.html"><img src="img/quiz.png" alt="marie" class="cabecalho-menu-img"></a>
            <nav class="menu">
                <a href="pontuacao.html">Pontuação</a>
                <a href="respostas.html">Respostas</a>
                <a href="contato.html">Contato</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <h2 class="escrita">Nos dê o seu feedback</h2>
        <form>
            <fieldset>
                <legend>Informações de contato</legend>

                <label for="Nome">Nome:</label>
                <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>

                <label for="Email">Email:</label>
                <input type="email" name="email" id="Email" placeholder="Exemplo@com.br" required><br>

                 <label for="Comentario">Comentario:</label><br>
                <textarea name="Comentario" id="Comentario" placeholder="Digite o seu Comentario" required cols="50" rows="10">
                </textarea><br>

                <button type="submit">Concluido</button>
            </fieldset>
        </form>
        <button>Enviar Quiz</button>
    </main>
    <footer class="rodape">
        <p>
            &copy quiz de programação todos os direitos reservados
        </p>
        <p>
            Para conhecer mais sobre mim <a href="https://rafaelablasque.github.io/Portfolio/" class="footer-link" target="_blank">clique aqui</a>.
        </p>
    </footer>
</body>
</html>
